apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "intelgraph.fullname" . }}
  labels:
    {{- include "intelgraph.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- if eq .Values.storage.backend "sqlite" }}
  INTELGRAPH_DB_PATH: /data/db/intelgraph.db
  {{- end }}
  {{- if .Values.redis.enabled }}
  INTELGRAPH_DISTRIBUTED_ENABLED: "true"
  {{- if .Values.redis.url }}
  REDIS_URL: {{ .Values.redis.url | quote }}
  {{- end }}
  {{- end }}
