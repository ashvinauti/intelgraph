{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "intelgraph.fullname" . }}
  labels:
    {{- include "intelgraph.labels" . | nindent 4 }}
type: Opaque
stringData:
  INTELGRAPH_SECRET_KEY: {{ required "secrets.INTELGRAPH_SECRET_KEY is required (>=32 random chars) when secrets.create is true" .Values.secrets.INTELGRAPH_SECRET_KEY | quote }}
  {{- if .Values.secrets.DATABASE_URL }}
  DATABASE_URL: {{ .Values.secrets.DATABASE_URL | quote }}
  {{- end }}
  {{- if .Values.secrets.OTX_API_KEY }}
  OTX_API_KEY: {{ .Values.secrets.OTX_API_KEY | quote }}
  {{- end }}
  {{- if .Values.secrets.VIRUSTOTAL_API_KEY }}
  VIRUSTOTAL_API_KEY: {{ .Values.secrets.VIRUSTOTAL_API_KEY | quote }}
  {{- end }}
  {{- if .Values.secrets.SHODAN_API_KEY }}
  SHODAN_API_KEY: {{ .Values.secrets.SHODAN_API_KEY | quote }}
  {{- end }}
{{- end }}
